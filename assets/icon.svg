<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#332970"/>
      <stop offset="1" stop-color="#4a52c7"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <!-- subtle top-edge glass highlight, matching the app's own surfaces -->
    <rect x="0" y="0" width="1024" height="460" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- camera body -->
  <rect x="270" y="340" width="360" height="344" rx="62" fill="#ffffff"/>
  <!-- camera lens flag -->
  <path d="M 630 424 L 780 340 L 780 684 L 630 600 Z" fill="#ffffff"/>

  <!-- broadcast arcs: the "-> NDI" half of "webcam -> NDI source". Three 90°
       quarter-arcs fanning out from the lens flag's tip (780, 512), classic
       radio-wave/WiFi-glyph shape rather than concentric full circles. -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <path d="M 844 448 A 90 90 0 0 1 844 576" opacity="0.95"/>
    <path d="M 883 410 A 145 145 0 0 1 883 615" opacity="0.75"/>
    <path d="M 921 371 A 200 200 0 0 1 921 653" opacity="0.55"/>
  </g>
</svg>
