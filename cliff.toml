# git-cliff configuration — generates CHANGELOG.md from commits. The release
# workflow uses plain `gh release create --generate-notes` for release notes; this
# file exists for anyone producing a curated in-repo changelog locally.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{%- for group, commits in commits | group_by(attribute="group") -%}
    ### {{ group | striptags | trim | capitalize }}
    {%- for commit in commits -%}
        - {{ commit.message | upper_first }}
    {%- endfor -%}
{%- endfor %}
"""
footer = """

<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore", group = "Changed" },
  { message = "^ci", group = "CI" },
  { body = ".*security", group = "Security" },
]

filter_commits = false
tag_pattern = "v*"
