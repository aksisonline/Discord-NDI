name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: app
        # ndi.test.ts skips gracefully via test.skipIf(!grandiose) when the native
        # addon can't load (no macOS/arm64 binary available on this runner).
        run: bun test

  # Kept as a named job so the release workflow's test gate can depend on the
  # whole matrix, and so a future lint job lands in the same gate.
  check:
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # tsc resolves app/ndi.ts's bare `grandiose` import relative to app/, not
      # shell/discord-ndi/ — needs app's own node_modules present too.
      # --ignore-scripts: grandiose is an optionalDependency whose install script
      # (node-gyp rebuild) fails on Linux; Bun then silently drops the whole package
      # from node_modules, and tsc errors TS2307 on `await import("grandiose")`.
      # Skipping scripts keeps the extracted package (and its index.d.ts) on disk,
      # which is all a type check needs.
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install shell dependencies
        working-directory: shell/discord-ndi
        run: bun install --frozen-lockfile

      # sync bootstraps .hutch/devkit (Electrobun's ambient types + vendored
      # tsconfig) without a full platform build — cheap and cross-platform.
      - name: Sync Electrobun devkit
        working-directory: shell/discord-ndi
        env:
          HUTCH_HOME: ${{ github.workspace }}/shell/discord-ndi/.hutch
        run: bunx electrobun sync --env=stable

      # Type-checks app/ through shell/discord-ndi's tsconfig, since that's the
      # one config that actually resolves Electrobun's ambient types. Pinned
      # to typescript@5.7 in shell/discord-ndi's devDependencies: TS7 hard-errors
      # on Electrobun's own vendored tsconfig (removed `baseUrl`), which isn't
      # ours to patch — it's toolchain-generated and gitignored.
      - name: Type check
        working-directory: shell/discord-ndi
        run: bunx tsc -p tsconfig.json --noEmit
