name: release

# Triggered by `test` workflow success on main (workflow_run), or manually for a stable tag.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
  workflow_dispatch:
    inputs:
      stable:
        description: 'Set to "true" to publish a stable (non-prerelease) release.'
        required: false
        type: string
        default: "false"

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve next version. Prereleases target the NEXT minor off the latest stable
      # tag (default 0.1.0 when none exists); the -rc.N counter increments per base.
      # Stable releases are cut from that same bumped base. This keeps tags advancing
      # instead of reusing 0.0.0 once a prerelease exists.
      - uses: actions/github-script@v7
        id: version
        with:
          script: |
            const { execSync } = require("child_process");
            const tags = execSync("git tag --list 'v*' --sort -v:refname")
              .toString().split("\n").filter(Boolean);
            const bumpMinor = (v) => {
              const [maj, min] = v.split(".");
              return `${maj}.${Number(min) + 1}.0`;
            };
            const latestStable = tags.find(t => !/-rc\./.test(t));
            const base = latestStable
              ? bumpMinor(latestStable.replace(/^v/, ""))
              : "0.1.0";
            const stable = ("${{ github.event.inputs.stable }}" || "false") === "true";

            let tag, prerelease;
            if (stable) {
              tag = `v${base}`;
              prerelease = "false";
            } else {
              const rcTags = tags.filter(t => t.startsWith(`v${base}-rc.`));
              tag = `v${base}-rc.${rcTags.length + 1}`;
              prerelease = "true";
            }

            console.log(`tag=${tag}`);
            require("fs").writeFileSync(process.env.GITHUB_OUTPUT,
              `tag=${tag}\nprerelease=${prerelease}\n`, { flag: "a" });

  # Native SwiftUI shell — "for the looks", per the call to build mac natively and
  # leave Windows on Electrobun. package.sh assembles a real .app: swift build for the
  # shell, plus a plain `bun build` of the existing app/index.ts backend run by a
  # bundled copy of the bun executable (not `bun build --compile`: its runtime can't
  # resolve grandiose's own nested `require("bindings")` at all — confirmed by testing
  # directly, not assumed).
  build-macos:
    needs: [prepare]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        # grandiose compiles via node-gyp; macos runners have Xcode CLT for it.
        run: bun install --frozen-lockfile

      - name: Assemble Discord-NDI.app
        run: bash shell/discord-ndi-mac/package.sh

      - name: Create DMG
        working-directory: shell/discord-ndi-mac/build
        run: hdiutil create -volname Discord-NDI -srcfolder Discord-NDI.app -ov -format UDZO Discord-NDI.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: shell/discord-ndi-mac/build/Discord-NDI.dmg

  # Entirely unverified — no Windows machine has ever run this project. Keep it
  # non-blocking so a macOS-only draft still ships; the Windows artifact simply
  # won't attach until the build output path is confirmed on a real runner.
  build-windows:
    needs: [prepare]
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build Electrobun package
        working-directory: shell/discord-ndi
        env:
          HUTCH_HOME: ${{ github.workspace }}/shell/discord-ndi/.hutch
        run: bunx electrobun build --env=stable

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # Only the NSIS installer is a release-worthy installable; the raw
          # launcher.exe and update-bundle metadata/tar.zst siblings aren't.
          # May be empty until the Windows build path is confirmed; release step
          # tolerates a missing windows artifact.
          if-no-files-found: warn
          path: shell/discord-ndi/build/stable-win-*/**/*Setup.exe

  release:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      # Windows job was continue-on-error above in spirit; we use continue-on-error here
      # so a failed Windows build doesn't block drafting the macOS half.
      - name: Download Windows artifact (skip on failure)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      # --generate-notes groups commits as Added/Fixed etc. Attach the build artifacts
      # (the .dmg/.app) by their actual file paths; gh release create ignores directory
      # arguments, so expand recursively and keep only regular files. Windows may be
      # absent (unverified) — skip it silently.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ARGS=(--draft --generate-notes)
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          shopt -s globstar nullglob
          declare -A SEEN
          FILES=()
          for d in macos windows; do
            [ -d "$d" ] && for f in "$d"/**/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ -n "${SEEN[$base]:-}" ]; then
                # gh names assets from the basename (a #label only changes the
                # display label, not the name), so a real duplicate across
                # macos/windows (e.g. both emit metadata.json) needs renaming.
                renamed="$d/${d}-${base}"
                mv "$f" "$renamed"
                FILES+=("$renamed")
              else
                SEEN[$base]=1
                FILES+=("$f")
              fi
            done
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no build artifacts to attach"
            exit 1
          fi
          gh release create "$TAG" "${ARGS[@]}" "${FILES[@]}"
