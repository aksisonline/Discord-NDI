name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release to'
        required: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Assemble Discord-NDI.app
        run: bash shell/discord-ndi-mac/package.sh

      - name: Create DMG
        working-directory: shell/discord-ndi-mac/build
        run: hdiutil create -volname Discord-NDI -srcfolder Discord-NDI.app -ov -format UDZO Discord-NDI.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: shell/discord-ndi-mac/build/Discord-NDI.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build Electrobun package
        working-directory: shell/discord-ndi
        env:
          HUTCH_HOME: ${{ github.workspace }}/shell/discord-ndi/.hutch
        run: bunx electrobun build --env=stable

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: warn
          path: shell/discord-ndi/build/stable-win-*/**/*Setup.exe

  upload:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - name: Download Windows artifact (skip on failure)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          declare -A SEEN
          FILES=()
          MAC_FILE=""
          WIN_FILE=""
          for d in macos windows; do
            [ -d "$d" ] && for f in "$d"/**/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ -n "${SEEN[$base]:-}" ]; then
                renamed="$d/${d}-${base}"
                mv "$f" "$renamed"
                FILES+=("$renamed")
                if [ "$d" = "macos" ]; then MAC_FILE="${d}-${base}"; fi
                if [ "$d" = "windows" ]; then WIN_FILE="${d}-${base}"; fi
              else
                SEEN[$base]=1
                FILES+=("$f")
                if [ "$d" = "macos" ]; then MAC_FILE="$base"; fi
                if [ "$d" = "windows" ]; then WIN_FILE="$base"; fi
              fi
            done
          done
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no build artifacts to attach"
            exit 1
          fi
          
          # Upload files to the release
          gh release upload "$TAG" "${FILES[@]}" --clobber
          
          # UPDATE README DYNAMICALLY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$MAC_FILE" ]; then
            sed -i -e "s|<!-- download-mac -->.*<!-- /download-mac -->|<!-- download-mac --><a href=\"https://github.com/aksisonline/Discord-NDI/releases/download/$TAG/$MAC_FILE\"><img src=\"https://shieldcn.dev/badge/Download_macOS-blue.png?logo=apple\" alt=\"Download macOS\"/></a><!-- /download-mac -->|g" README.md || true
          fi
          
          if [ -n "$WIN_FILE" ]; then
            sed -i -e "s|<!-- download-win -->.*<!-- /download-win -->|<!-- download-win --><a href=\"https://github.com/aksisonline/Discord-NDI/releases/download/$TAG/$WIN_FILE\"><img src=\"https://shieldcn.dev/badge/Download_Windows-blue.png?logo=windows\" alt=\"Download Windows\"/></a><!-- /download-win -->|g" README.md || true
          fi
          
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update dynamic download links for $TAG [skip ci]"
            # When run from a release, push to main
            git push origin main || true
          fi
