name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release to'
        required: true

jobs:
  # Single source of truth for the release version: both build jobs stamp their
  # artifact's version string from this instead of the hardcoded values that used
  # to drift from the actual tag (e.g. shipping v0.1.1 with an Info.plist still
  # reading 0.1.0).
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Assemble Discord-NDI.app
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash shell/discord-ndi-mac/package.sh

      - name: Create DMG
        run: |
          brew install create-dmg
          # create-dmg's AppleScript Finder step can exit non-zero even after writing
          # a good dmg (a known upstream quirk); treat "the file exists" as success.
          create-dmg \
            --volname "Discord-NDI" \
            --volicon "assets/AppIcon.icns" \
            --background "assets/dmg-background.png" \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Discord-NDI.app" 160 185 \
            --hide-extension "Discord-NDI.app" \
            --app-drop-link 500 185 \
            "shell/discord-ndi-mac/build/Discord-NDI.dmg" \
            "shell/discord-ndi-mac/build/Discord-NDI.app" \
            || test -f "shell/discord-ndi-mac/build/Discord-NDI.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          if-no-files-found: error
          path: shell/discord-ndi-mac/build/Discord-NDI.dmg

  build-windows:
    needs: [resolve-version]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Stamp release version
        shell: bash
        working-directory: shell/discord-ndi
        run: |
          sed -i -e 's/version: "[^"]*"/version: "${{ needs.resolve-version.outputs.version }}"/' electrobun.config.ts

      - name: Build Electrobun package
        working-directory: shell/discord-ndi
        env:
          HUTCH_HOME: ${{ github.workspace }}/shell/discord-ndi/.hutch
        run: bunx electrobun build --env=stable

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: warn
          # artifacts/ is Electrobun's self-updater output (see electrobun.config.ts's
          # release.baseUrl): a manifest + tarball (+ patch once a previous release
          # exists) named exactly what Updater.checkForUpdate() requests from GitHub's
          # /releases/latest/download/<name> URLs. Must ship as release assets under
          # those exact flat names, same as the installer.
          path: |
            shell/discord-ndi/build/stable-win-*/**/*Setup.exe
            shell/discord-ndi/artifacts/*

  upload:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos
          path: macos

      - name: Download Windows artifact (skip on failure)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: windows
          path: windows

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Ensure it isn't a draft if it already exists
          gh release view "$TAG" && gh release edit "$TAG" --draft=false || gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # windows/* preserves the nested build path (windows/stable-win-x64/...),
          # so a plain glob upload hands gh a directory and fails silently under
          # `|| true` — find the actual files instead of globbing top-level entries.
          MAC_PATH=$(find macos -name "*.dmg" | head -n 1)
          WIN_PATH=$(find windows -name "*Setup.exe" | head -n 1)

          UPLOAD_PATHS=("$MAC_PATH")
          [ -n "$WIN_PATH" ] && UPLOAD_PATHS+=("$WIN_PATH")
          # The self-updater manifest/tarball/patch, uploaded under their own exact
          # names (stable-win-x64-update.json etc.) — Updater.checkForUpdate() fetches
          # these straight from /releases/latest/download/<name>.
          while IFS= read -r -d '' f; do UPLOAD_PATHS+=("$f"); done \
            < <(find windows/artifacts -type f -print0 2>/dev/null)
          gh release upload "$TAG" "${UPLOAD_PATHS[@]}" --clobber

          # Extract the primary filenames for the README links
          MAC_FILE=$(basename "$MAC_PATH")
          WIN_FILE=$([ -n "$WIN_PATH" ] && basename "$WIN_PATH")
          
          # UPDATE README DYNAMICALLY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$MAC_FILE" ]; then
            sed -i -e "s|<!-- download-mac -->.*<!-- /download-mac -->|<!-- download-mac --><a href=\"https://github.com/aksisonline/Discord-NDI/releases/download/$TAG/$MAC_FILE\"><img src=\"https://shieldcn.dev/badge/Download%20for-MacOS-3B2D8A.svg?logo=apple\" alt=\"Download macOS\" /></a><!-- /download-mac -->|g" README.md || true
          fi
          
          if [ -n "$WIN_FILE" ]; then
            sed -i -e "s|<!-- download-win -->.*<!-- /download-win -->|<!-- download-win --><a href=\"https://github.com/aksisonline/Discord-NDI/releases/download/$TAG/$WIN_FILE\"><img src=\"https://shieldcn.dev/badge/Download%20for-Windows-3B2D8A.svg?logo=ri%3AFaMicrosoft\" alt=\"Download Windows\" /></a><!-- /download-win -->|g" README.md || true
          fi
          
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update dynamic download links for $TAG [skip ci]"
            # When run from a release, push to main
            git push origin HEAD:main || true
          fi
