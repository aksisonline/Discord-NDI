<!doctype html>
<meta charset="utf-8">
<title>Discord-NDI</title>
<style>
  :root { color-scheme: dark; --bg:#1a1b1e; --card:#25262b; --fg:#e9ecef; --dim:#909296; --on:#37b24d; --off:#495057; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); padding:28px; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--card); padding:16px 18px; border-radius:10px; }
  button { appearance:none; border:0; border-radius:999px; width:58px; height:32px; background:var(--off); position:relative; cursor:pointer; transition:background .15s; }
  button[aria-pressed="true"] { background:var(--on); }
  button::after { content:""; position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s; }
  button[aria-pressed="true"]::after { transform:translateX(26px); }
  .state { font-weight:600; }
  ul { list-style:none; padding:0; margin:20px 0 0; }
  li { background:var(--card); padding:11px 16px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .frames { color:var(--dim); font-variant-numeric:tabular-nums; }
  .empty, .warn { color:var(--dim); font-size:13px; margin-top:18px; }
  .warn { color:#ffa94d; }
</style>

<h1>Discord-NDI</h1>
<div class="sub">Every participant in your call as a separate NDI source.</div>

<div class="row">
  <button id="toggle" aria-pressed="false" aria-label="Toggle capture"></button>
  <span class="state" id="state">Off</span>
</div>

<ul id="sources"></ul>
<div class="empty" id="empty">Not capturing.</div>
<div class="warn" id="warn" hidden></div>

<script>
const $ = id => document.getElementById(id);
let busy = false;

async function refresh() {
  const s = await (await fetch("/api/status")).json();

  $("toggle").setAttribute("aria-pressed", String(s.running));
  $("state").textContent = busy ? "Working…" : s.running ? "Capturing" : "Off";

  $("sources").innerHTML = s.sources.map(src =>
    `<li><span>${src.name}</span><span class="frames">${src.live ? src.frames.toLocaleString() + " frames" : "starting…"}</span></li>`
  ).join("");

  $("empty").hidden = s.sources.length > 0;
  $("empty").textContent = s.running
    ? "Attached. Waiting for someone to turn a camera on."
    : "Not capturing.";

  $("warn").hidden = !!s.ndi;
  $("warn").textContent = s.ndi ? "" : "NDI unavailable: " + (s.error || "grandiose failed to load");
}

$("toggle").onclick = async () => {
  if (busy) return;
  busy = true;
  await refresh();
  try {
    const r = await fetch("/api/" + ($("toggle").getAttribute("aria-pressed") === "true" ? "stop" : "start"), { method: "POST" });
    if (!r.ok) alert(await r.text());
  } finally {
    busy = false;
    refresh();
  }
};

refresh();
setInterval(refresh, 1000);
</script>
