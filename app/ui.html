<!doctype html>
<meta charset="utf-8">
<title>Discord-NDI</title>
<style>
  :root { color-scheme: dark; --bg:#1a1b1e; --card:#25262b; --row:#2c2e33; --fg:#e9ecef; --dim:#909296; --on:#37b24d; --off:#495057; --accent:#4dabf7; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); padding:28px; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--card); padding:14px 16px; border-radius:10px; }
  .row .label { display:flex; align-items:center; gap:10px; font-weight:600; }
  .switch { appearance:none; border:0; border-radius:999px; position:relative; cursor:pointer; transition:background .15s; flex-shrink:0; }
  .switch::after { content:""; position:absolute; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch.sm { width:38px; height:22px; background:var(--off); }
  .switch.sm::after { top:3px; left:3px; width:16px; height:16px; }
  .switch.sm[aria-pressed="true"] { background:var(--on); }
  .switch.sm[aria-pressed="true"]::after { transform:translateX(16px); }

  .channel-bar { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--dim); }
  .channel-bar .name { color:var(--fg); font-weight:600; }
  .channel-bar .dot { opacity:.5; }

  /* Front-and-center empty state: no active call at all, not just no cameras. */
  .no-vc { display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; margin-top:80px; color:var(--dim); }
  .no-vc .icon { font-size:32px; margin-bottom:6px; opacity:.7; }
  .no-vc .title { color:var(--fg); font-weight:600; font-size:15px; }
  .no-vc .sub { font-size:13px; }

  ul { list-style:none; padding:0; margin:20px 0 0; display:flex; flex-direction:column; gap:8px; }
  li { background:var(--card); border-radius:10px; padding:12px 14px; border:1px solid transparent; }
  li.off { border-color:var(--off); opacity:.6; }
  .source-top { display:flex; align-items:center; gap:10px; }
  .source-name { flex:1; font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn { appearance:none; border:0; background:var(--row); color:var(--fg); width:30px; height:30px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .icon-btn:hover { background:var(--off); }
  .source-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--row); font-size:12px; }
  .url { color:var(--accent); font-family:ui-monospace,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .paused { color:var(--dim); }
  .empty, .warn { color:var(--dim); font-size:13px; margin-top:18px; }
  .warn { color:#ffa94d; }
</style>

<h1>Discord-NDI</h1>
<div class="sub">Every participant in your call as a separate NDI source and browser URL.</div>

<div class="row">
  <span class="label" id="state">Attaching…</span>
</div>

<div class="channel-bar" id="channelBar" hidden>
  <span class="name" id="channelName"></span>
  <span class="dot">·</span>
  <span id="memberCount"></span>
  <span class="dot">·</span>
  <span id="streamCount"></span>
</div>

<div class="no-vc" id="noVc" hidden>
  <div class="icon">&#127908;</div>
  <div class="title">No active voice call</div>
  <div class="sub">Join a voice channel in Discord to start capturing.</div>
</div>

<ul id="sources"></ul>
<div class="empty" id="empty" hidden></div>
<div class="warn" id="warn" hidden></div>

<script>
const $ = id => document.getElementById(id);
let lastSourcesJson = "";

function rotateIcon(deg) {
  return deg === 0 ? "&#8635;" : deg + "&deg;";
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) return alert(await r.text());
  refresh();
}

function copyUrl(url) {
  navigator.clipboard.writeText(location.origin + url).catch(() => {});
}

function render(sources) {
  // The list re-renders wholesale via innerHTML, which yanks buttons out from under an
  // in-flight click if it runs during one — skip the rebuild when nothing that affects
  // the DOM changed. `frames` is deliberately excluded: it changes on every poll while
  // capturing, which would otherwise force a rebuild every single second regardless.
  const json = JSON.stringify(sources.map(({ key, name, enabled, rotation, url }) => ({ key, name, enabled, rotation, url })));
  if (json === lastSourcesJson) return;
  lastSourcesJson = json;

  $("sources").innerHTML = sources.map(src => `
    <li class="${src.enabled ? "" : "off"}">
      <div class="source-top">
        <span class="source-name">${src.name}</span>
        <button class="icon-btn" aria-label="Rotate" data-rotate="${src.key}" data-current="${src.rotation}">${rotateIcon(src.rotation)}</button>
        <button class="switch sm" aria-pressed="${src.enabled}" aria-label="Toggle source" data-enable="${src.key}" data-current="${src.enabled}"></button>
      </div>
      <div class="source-bottom">
        ${src.enabled
          ? `<span class="url">${location.host}${src.url}</span><button class="icon-btn" aria-label="Copy URL" data-copy="${src.url}">&#10697;</button>`
          : `<span class="paused">off — source paused</span>`}
      </div>
    </li>
  `).join("");

  $("sources").querySelectorAll("[data-rotate]").forEach(btn => btn.onclick = () => {
    const next = { 0: 90, 90: 180, 180: 270, 270: 0 }[Number(btn.dataset.current)];
    post(`/api/source/${encodeURIComponent(btn.dataset.rotate)}/rotation`, { rotation: next });
  });
  $("sources").querySelectorAll("[data-enable]").forEach(btn => btn.onclick = () => {
    post(`/api/source/${encodeURIComponent(btn.dataset.enable)}/enabled`, { enabled: btn.dataset.current !== "true" });
  });
  $("sources").querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copyUrl(btn.dataset.copy));
}

async function refresh() {
  const s = await (await fetch("/api/status")).json();

  $("state").textContent = s.running ? "Capturing" : "Attaching…";

  const inCall = s.running && !!s.name;

  $("channelBar").hidden = !inCall;
  if (inCall) {
    $("channelName").textContent = s.name;
    $("memberCount").textContent = `${s.members} member${s.members === 1 ? "" : "s"}`;
    $("streamCount").textContent = `${s.sources.length} stream${s.sources.length === 1 ? "" : "s"}`;
  }

  $("noVc").hidden = !s.running || inCall;

  if (inCall) render(s.sources);
  $("sources").hidden = !inCall;

  $("empty").hidden = !inCall || s.sources.length > 0;
  $("empty").textContent = "Attached. Waiting for someone to turn a camera on.";

  $("warn").hidden = !!s.ndi;
  $("warn").textContent = s.ndi ? "" : "NDI unavailable: " + (s.error || "grandiose failed to load");
}

refresh();
setInterval(refresh, 1000);
</script>
